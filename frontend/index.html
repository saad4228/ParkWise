<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkWise — Smart Parking Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>

<!-- Icon sprite. Every icon in the app is one <use> away, so there are no
     image requests and no icon font to load. -->
<svg class="icon-sprite" aria-hidden="true" focusable="false">
  <symbol id="i-dashboard" viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"/></symbol>
  <symbol id="i-entry" viewBox="0 0 24 24"><path d="M5 12h12M13 8l4 4-4 4M4 4v16" stroke-width="2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-exit" viewBox="0 0 24 24"><path d="M19 12H7M11 8l-4 4 4 4M20 4v16" stroke-width="2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M7 2v3M17 2v3M3 8h18M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z" stroke-width="2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke-width="2" fill="none" stroke="currentColor" stroke-linecap="round"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M12 7v5l3 2M3 12a9 9 0 109-9 9 9 0 00-7.1 3.5M3 4v4h4" stroke-width="2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-reports" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7" stroke-width="2.5" fill="none" stroke="currentColor" stroke-linecap="round"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 009 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1A1.6 1.6 0 004.6 9a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-car" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 17v-3.6l1.9-4.8A2 2 0 018 7.3h8a2 2 0 011.9 1.3l1.9 4.8V17"/><path d="M4.2 13.4h15.6"/><circle cx="7.6" cy="16.9" r="1.7"/><circle cx="16.4" cy="16.9" r="1.7"/></g></symbol>
  <symbol id="i-free" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2.6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-2 8-2 8h16s-2-1-2-8M13.7 21a2 2 0 01-3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-rupee" viewBox="0 0 24 24"><path d="M7 4h10M7 8h10M14.5 4c0 5-3 6-7 6l7 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01M10.3 3.9L2.5 17.4A2 2 0 004.2 20.4h15.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-4a2 2 0 012-2h16a2 2 0 012 2v4a2 2 0 01-2 2h-2M6 14h12v7H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5L12 15l4.5-4.5M4 20h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1111 3a7 7 0 1010 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="6" cy="16.5" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="16.5" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 16.5l4-7h5l3 7M10 9.5h5.5M14 6h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-suv" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 17v-4.4l1.7-5A2 2 0 017 6.2h10a2 2 0 011.9 1.4l1.7 5V17"/><path d="M3.4 12.6h17.2M12 6.4v6.2"/><circle cx="7.2" cy="16.9" r="1.7"/><circle cx="16.8" cy="16.9" r="1.7"/></g></symbol>
</svg>

<div class="app-shell">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span class="brand-name">ParkWise</span>
    </div>
    <nav class="sidebar__nav" aria-label="Main">
      <a class="nav-item" href="#/dashboard"    data-route="dashboard"><svg class="nav-item__icon"><use href="#i-dashboard"/></svg><span>Dashboard</span></a>
      <a class="nav-item" href="#/entry"        data-route="entry"><svg class="nav-item__icon"><use href="#i-entry"/></svg><span>Vehicle Entry</span></a>
      <a class="nav-item" href="#/exit"         data-route="exit"><svg class="nav-item__icon"><use href="#i-exit"/></svg><span>Vehicle Exit</span></a>
      <a class="nav-item" href="#/slots"        data-route="slots"><svg class="nav-item__icon"><use href="#i-grid"/></svg><span>Parking Slots</span></a>
      <a class="nav-item" href="#/reservations" data-route="reservations"><svg class="nav-item__icon"><use href="#i-calendar"/></svg><span>Reservations</span></a>
      <a class="nav-item" href="#/queue"        data-route="queue"><svg class="nav-item__icon"><use href="#i-queue"/></svg><span>Waiting Queue</span><span class="nav-item__badge" id="queueBadge" hidden>0</span></a>
      <a class="nav-item" href="#/history"      data-route="history"><svg class="nav-item__icon"><use href="#i-history"/></svg><span>Parking History</span></a>
      <a class="nav-item" href="#/reports"      data-route="reports"><svg class="nav-item__icon"><use href="#i-reports"/></svg><span>Reports</span></a>
      <a class="nav-item" href="#/settings"     data-route="settings"><svg class="nav-item__icon"><use href="#i-settings"/></svg><span>Settings</span></a>
    </nav>
    <div class="sidebar__foot">
      <div class="sidebar__status" id="sidebarStatus">
        <span class="dot dot--ok" aria-hidden="true"></span>
        <span id="sidebarStatusText">Connected</span>
      </div>
      <p class="sidebar__version">ParkWise v1.0 &middot; local</p>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

  <!-- ===== Main column ===== -->
  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn topbar__menu" id="menuToggle" aria-label="Open navigation">
        <svg><use href="#i-menu"/></svg>
      </button>

      <form class="topbar__search" id="globalSearchForm" role="search">
        <svg class="topbar__search-icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="globalSearch" placeholder="Search vehicle, ticket or slot&hellip;"
               aria-label="Search vehicle, ticket or slot" autocomplete="off">
      </form>

      <div class="topbar__actions">
        <button class="icon-btn" id="themeToggle" aria-label="Switch to dark theme" title="Switch theme">
          <svg class="theme-icon-light"><use href="#i-moon"/></svg>
          <svg class="theme-icon-dark"><use href="#i-sun"/></svg>
        </button>
        <button class="icon-btn icon-btn--bell" id="alertsButton" aria-label="Alerts">
          <svg><use href="#i-bell"/></svg>
          <span class="icon-btn__dot" id="alertsDot" hidden></span>
        </button>
        <div class="topbar__user">
          <span class="avatar" aria-hidden="true">A</span>
          <span class="topbar__user-name">Admin</span>
        </div>
      </div>
    </header>

    <main class="page" id="page" tabindex="-1">
      <!-- Each screen renders itself in here. -->
    </main>
  </div>
</div>

<!-- Toasts, dialogs and the print sheet are mounted outside the layout so
     nothing can clip them. -->
<div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="false"></div>
<div class="dialog-host" id="dialogHost" hidden></div>
<div class="print-host" id="printHost" aria-hidden="true"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
