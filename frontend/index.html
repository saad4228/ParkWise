<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkWise — Smart Parking Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>

<!-- Icon sprite. Every icon in the app is one <use> away, so there are no
     image requests and no icon font to load. -->
<svg class="icon-sprite" aria-hidden="true" focusable="false">
  <symbol id="i-dashboard" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/></g></symbol>
  <symbol id="i-entry" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16"/><path d="M8.5 12h10"/><path d="M14.5 8l4 4-4 4"/></g></symbol>
  <symbol id="i-exit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4v16"/><path d="M15.5 12h-10"/><path d="M9.5 8l-4 4 4 4"/></g></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/></g></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M7 2v3M17 2v3M3 8h18M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z" stroke-width="2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h9"/></g></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M12 7v5l3 2M3 12a9 9 0 109-9 9 9 0 00-7.1 3.5M3 4v4h4" stroke-width="2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-reports" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11.5"/><path d="M12 20V4.5"/><path d="M19 20v-6"/></g></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 009 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1A1.6 1.6 0 004.6 9a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-car" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 16.8v-3.3l1.7-4.4A2 2 0 018.2 7.7h7.6a2 2 0 011.9 1.4l1.7 4.4v3.3"/><path d="M4.6 13.5h14.8"/><circle cx="7.8" cy="16.6" r="1.5"/><circle cx="16.2" cy="16.6" r="1.5"/></g></symbol>
  <symbol id="i-free" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.4V12l3.2 1.9"/></g></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.6"/><path d="M19.5 19.5l-3.8-3.8"/></g></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-2 8-2 8h16s-2-1-2-8M13.7 21a2 2 0 01-3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-rupee" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5h9M7.5 8.5h9M14 4.5c0 4.6-2.8 5.6-6.5 5.6l6.5 9.4"/></g></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6l4.6 4.6L19 7.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01M10.3 3.9L2.5 17.4A2 2 0 004.2 20.4h15.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></g></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-4a2 2 0 012-2h16a2 2 0 012 2v4a2 2 0 01-2 2h-2M6 14h12v7H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5L12 15l4.5-4.5M4 20h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1111 3a7 7 0 1010 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></g></symbol>
  <symbol id="i-bike" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.2" cy="16.3" r="3"/><circle cx="17.8" cy="16.3" r="3"/><path d="M6.2 16.3l3.8-6.6h4.7l2.9 6.6M10 9.7h5.2M14 6.6h2.8"/></g></symbol>
  <symbol id="i-suv" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.9 16.9v-4l1.6-4.6A2 2 0 017.4 6.9h9.2a2 2 0 011.9 1.4l1.6 4.6v4"/><path d="M3.9 12.9h16.2M12 7.1v5.8"/><circle cx="7.4" cy="16.7" r="1.5"/><circle cx="16.6" cy="16.7" r="1.5"/></g></symbol>

  <!-- The ParkWise mark. Unlike the interface icons above it carries its own
       colour, because it is a logo rather than a glyph that takes the colour
       of its surroundings. -->
  <defs>
    <linearGradient id="pwRibbon" x1="18" y1="3" x2="56" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ACE92"/><stop offset=".5" stop-color="#13A36D"/><stop offset="1" stop-color="#0A7A5C"/>
    </linearGradient>
    <linearGradient id="pwRoad" x1="30" y1="13" x2="16" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F9A68"/><stop offset="1" stop-color="#096A50"/>
    </linearGradient>
  </defs>
  <symbol id="pw-mark" viewBox="0 0 64 64">
    <path fill="url(#pwRoad)" d="M21.6 13.4C19 26 15.2 38.8 11.9 50.2 10.5 55.2 12.6 58.6 17.4 58.6L35.4 58.6C30.2 56.6 27.4 52 26.9 44.6 26.3 34 28.5 23 31.2 14.2Z"/>
    <path fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="3.8 5.6" opacity=".93" d="M26.4 16C24 26.4 21.4 34.6 21.3 42.4 21.2 49.6 21.8 53.6 22.4 56.4"/>
    <path fill="url(#pwRibbon)" d="M20.6 7.4C31.4 1.2 46.6 1.8 53.6 9 61 16.6 61 30.2 53.8 37.8 46.8 45.2 38.2 46.8 31 44.9L33.5 30.9C40.1 32.3 46.7 29.5 46.7 23.3 46.7 17.4 40.6 14.6 34.2 16.5 30.8 11.6 25.9 8.5 20.6 7.4Z"/>
    <path fill="#06513F" opacity=".2" d="M34.2 16.5C30.8 11.6 25.9 8.5 20.6 7.4 27.4 3.5 35.6 1.9 43 3.1 38.6 6.6 35.6 11.1 34.2 16.5Z"/>
    <circle cx="40.1" cy="23.2" r="11" fill="#FFFFFF"/>
    <path fill="#15233A" d="M36.3 17.5C36.6 16.5 37.4 15.9 38.4 15.9H41.9C42.9 15.9 43.7 16.5 44 17.5L45.2 21C46.4 21.4 47.2 22.4 47.2 23.7V27.9C47.2 28.6 46.6 29.2 45.9 29.2H44.8C44.1 29.2 43.5 28.6 43.5 27.9V27.3H36.8V27.9C36.8 28.6 36.2 29.2 35.5 29.2H34.4C33.7 29.2 33.1 28.6 33.1 27.9V23.7C33.1 22.4 33.9 21.4 35.1 21Z"/>
    <path fill="#FFFFFF" opacity=".92" d="M37.3 18.3H43L43.8 20.7H36.5Z"/>
  </symbol>

  <!-- Workspace controls -->
  <symbol id="i-plus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5v13M5.5 12h13"/></g></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5.5 12h13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chevrons" viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M12 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 4v16" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

</svg>

<!-- Nine navigation links sit before the content in the source order, so a
     keyboard user gets a way past them on the first load. -->
<a class="skip-link" href="#page">Skip to main content</a>

<div class="app-shell">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <svg class="brand-mark" aria-hidden="true"><use href="#pw-mark"/></svg>
      <span class="brand-name">Park<span class="brand-name__accent">Wise</span></span>
    </div>
    <nav class="sidebar__nav" aria-label="Main">
      <!-- data-tip is the label shown beside an icon when the menu is collapsed.
           The visible <span> stays in the DOM either way, so the link always
           has a name for a screen reader. -->
      <a class="nav-item" href="#/dashboard"    data-route="dashboard"    data-tip="Dashboard"><svg class="nav-item__icon"><use href="#i-dashboard"/></svg><span class="nav-item__label">Dashboard</span></a>
      <a class="nav-item" href="#/entry"        data-route="entry"        data-tip="Vehicle Entry"><svg class="nav-item__icon"><use href="#i-entry"/></svg><span class="nav-item__label">Vehicle Entry</span></a>
      <a class="nav-item" href="#/exit"         data-route="exit"         data-tip="Vehicle Exit"><svg class="nav-item__icon"><use href="#i-exit"/></svg><span class="nav-item__label">Vehicle Exit</span></a>
      <a class="nav-item" href="#/slots"        data-route="slots"        data-tip="Parking Slots"><svg class="nav-item__icon"><use href="#i-grid"/></svg><span class="nav-item__label">Parking Slots</span></a>
      <a class="nav-item" href="#/reservations" data-route="reservations" data-tip="Reservations"><svg class="nav-item__icon"><use href="#i-calendar"/></svg><span class="nav-item__label">Reservations</span></a>
      <a class="nav-item" href="#/queue"        data-route="queue"        data-tip="Waiting Queue"><svg class="nav-item__icon"><use href="#i-queue"/></svg><span class="nav-item__label">Waiting Queue</span><span class="nav-item__badge" id="queueBadge" hidden>0</span></a>
      <a class="nav-item" href="#/history"      data-route="history"      data-tip="Parking History"><svg class="nav-item__icon"><use href="#i-history"/></svg><span class="nav-item__label">Parking History</span></a>
      <a class="nav-item" href="#/reports"      data-route="reports"      data-tip="Reports"><svg class="nav-item__icon"><use href="#i-reports"/></svg><span class="nav-item__label">Reports</span></a>
      <a class="nav-item" href="#/settings"     data-route="settings"     data-tip="Settings"><svg class="nav-item__icon"><use href="#i-settings"/></svg><span class="nav-item__label">Settings</span></a>
    </nav>
    <div class="sidebar__foot">
      <button class="sidebar__collapse" id="sidebarCollapse" type="button"
              aria-label="Collapse menu" data-tip="Expand menu">
        <svg aria-hidden="true"><use href="#i-panel"/></svg>
        <span class="nav-item__label">Collapse menu</span>
      </button>
      <p class="sidebar__version"><span class="nav-item__label">ParkWise v1.0 &middot; local</span></p>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

  <!-- ===== Main column ===== -->
  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn topbar__menu" id="menuToggle" aria-label="Open navigation">
        <svg><use href="#i-menu"/></svg>
      </button>

      <form class="topbar__search" id="globalSearchForm" role="search">
        <svg class="topbar__search-icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="globalSearch" placeholder="Search vehicle, ticket or slot&hellip;"
               aria-label="Search vehicle, ticket or slot (press / to jump here)"
               title="Press / to jump here" autocomplete="off">
      </form>

      <div class="topbar__actions">
        <!-- Whether the browser can reach the server right now. It turns red the
             moment a request fails, so a stale screen never looks live. -->
        <span class="live-pill" id="livePill" role="status" aria-live="polite">
          <span class="live-pill__dot" aria-hidden="true"></span>
          <span id="livePillText">Live</span>
        </span>
        <button class="icon-btn" id="themeToggle" aria-label="Switch to dark theme" title="Switch theme">
          <svg class="theme-icon-light"><use href="#i-moon"/></svg>
          <svg class="theme-icon-dark"><use href="#i-sun"/></svg>
        </button>
        <button class="icon-btn icon-btn--bell" id="alertsButton" aria-label="Alerts">
          <svg><use href="#i-bell"/></svg>
          <span class="icon-btn__dot" id="alertsDot" hidden></span>
        </button>
        <div class="topbar__user">
          <span class="avatar" aria-hidden="true">A</span>
          <span class="topbar__user-name">Admin</span>
        </div>
      </div>
    </header>

    <main class="page" id="page" tabindex="-1">
      <!-- Each screen renders itself in here. -->
    </main>
  </div>
</div>

<!-- Toasts, dialogs and the print sheet are mounted outside the layout so
     nothing can clip them. -->
<div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="false"></div>
<div class="dialog-host" id="dialogHost" hidden></div>
<div class="print-host" id="printHost" aria-hidden="true"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
