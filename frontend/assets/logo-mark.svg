<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ParkWise">
  <title>ParkWise</title>
  <!-- The ParkWise mark: a ribbon "P" whose stem is a road, with a car in the
       counter of the P. Vector art rather than a cropped image, so it stays
       sharp from a 16px favicon up to print, and can be recoloured. -->
  <defs>
    <linearGradient id="pwRibbon" x1="18" y1="3" x2="56" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ACE92"/>
      <stop offset=".5" stop-color="#13A36D"/>
      <stop offset="1" stop-color="#0A7A5C"/>
    </linearGradient>
    <linearGradient id="pwRoad" x1="30" y1="13" x2="16" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F9A68"/>
      <stop offset="1" stop-color="#096A50"/>
    </linearGradient>
  </defs>

  <!-- The road: the stem of the P, widening as it comes towards you. -->
  <path fill="url(#pwRoad)"
        d="M21.6 13.4 C19 26 15.2 38.8 11.9 50.2
           C10.5 55.2 12.6 58.6 17.4 58.6
           L35.4 58.6 C30.2 56.6 27.4 52 26.9 44.6
           C26.3 34 28.5 23 31.2 14.2 Z"/>
  <!-- Centre line. -->
  <path fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"
        stroke-dasharray="3.8 5.6" opacity=".93"
        d="M26.4 16 C24 26.4 21.4 34.6 21.3 42.4 C21.2 49.6 21.8 53.6 22.4 56.4"/>

  <!-- The ribbon bowl. Its inner edge sweeps back down to the road, so the
       two read as one continuous ribbon rather than a letter with a tail. -->
  <path fill="url(#pwRibbon)"
        d="M20.6 7.4 C31.4 1.2 46.6 1.8 53.6 9
           C61 16.6 61 30.2 53.8 37.8
           C46.8 45.2 38.2 46.8 31 44.9
           L33.5 30.9 C40.1 32.3 46.7 29.5 46.7 23.3
           C46.7 17.4 40.6 14.6 34.2 16.5
           C30.8 11.6 25.9 8.5 20.6 7.4 Z"/>
  <!-- The turn of the ribbon, where it folds over towards the road. -->
  <path fill="#06513F" opacity=".2"
        d="M34.2 16.5 C30.8 11.6 25.9 8.5 20.6 7.4
           C27.4 3.5 35.6 1.9 43 3.1 C38.6 6.6 35.6 11.1 34.2 16.5 Z"/>

  <circle cx="40.1" cy="23.2" r="11" fill="#FFFFFF"/>
  <!-- A car, seen head-on. -->
  <path fill="#15233A"
        d="M36.3 17.5 C36.6 16.5 37.4 15.9 38.4 15.9 H41.9 C42.9 15.9 43.7 16.5 44 17.5
           L45.2 21 C46.4 21.4 47.2 22.4 47.2 23.7 V27.9 C47.2 28.6 46.6 29.2 45.9 29.2
           H44.8 C44.1 29.2 43.5 28.6 43.5 27.9 V27.3 H36.8 V27.9 C36.8 28.6 36.2 29.2 35.5 29.2
           H34.4 C33.7 29.2 33.1 28.6 33.1 27.9 V23.7 C33.1 22.4 33.9 21.4 35.1 21 Z"/>
  <path fill="#FFFFFF" opacity=".92" d="M37.3 18.3 H43 L43.8 20.7 H36.5 Z"/>
</svg>
